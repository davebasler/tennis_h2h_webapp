<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#081733">
  <title>Head 2 Head</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="./" aria-label="Head 2 Head – home">
        <img class="brand__logo" src="assets/img/atp-tour.png" alt="" width="54" height="30">
        <span class="brand__title">Head <b>2</b> Head</span>
      </a>
      <nav class="topbar__nav" id="nav" aria-label="Admin"></nav>
    </div>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__inner">
      <h1 class="visually-hidden" id="hero-title">Head-to-head</h1>
      <div class="pickers">
        <div class="picker" id="picker-p1"></div>
        <button class="swap" id="swap" type="button" aria-label="Swap players" title="Swap players">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12m0 0-4-4m4 4-4 4M17 17H5m0 0 4-4m-4 4 4 4"/></svg>
        </button>
        <div class="picker" id="picker-p2"></div>
      </div>
      <div class="faceoff" id="faceoff" aria-live="polite">
        <div class="loading" role="status">Loading…</div>
      </div>
    </div>
  </section>

  <main class="content" id="content"></main>

  <footer class="footer">
    <p>Head 2 Head · Tennis records among friends</p>
  </footer>

  <div class="toasts" id="toasts" role="status" aria-live="polite" popover="manual"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <noscript><p class="noscript">This site needs JavaScript.</p></noscript>
</body>
</html>
